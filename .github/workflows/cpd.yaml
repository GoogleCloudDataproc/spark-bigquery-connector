name: Duplicate Code Detection

on:
  push:
    branches: [ master ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          persist-credentials: false
      - uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'

      - name: Running Duplicate Code Detection
        run: ./mvnw pmd:cpd-check -Pall -Daggregate=true
